name: Build and deploy React Vite app to Azure Web App - metahobbies

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: metahobbies-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build
        env:
          VITE_API_URL: https://server-mabs-fmepbygbfrb0b8eh.centralus-01.azurewebsites.net/api
          VITE_API_BASE_URL: https://server-mabs-fmepbygbfrb0b8eh.centralus-01.azurewebsites.net/api
          VITE_SOCKET_URL: https://server-mabs-fmepbygbfrb0b8eh.centralus-01.azurewebsites.net

          VITE_APP_ENV: production
          VITE_APP_HOST: metahobbies-dkejbeckefg6dwb9.centralus-01.azurewebsites.net
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_RELEASE_BRANCH: ${{ github.ref_name }}

          VITE_NEW_RELIC_ENABLED: "true"
          VITE_NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          VITE_NEW_RELIC_BROWSER_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          VITE_NEW_RELIC_BROWSER_LICENSE_KEY: ${{ secrets.NEW_RELIC_BROWSER_LICENSE_KEY }}
          VITE_NEW_RELIC_AGENT_ID: ${{ secrets.NEW_RELIC_AGENT_ID }}
          VITE_NEW_RELIC_DISTRIBUTED_TRACING_ORIGINS: https://server-mabs-fmepbygbfrb0b8eh.centralus-01.azurewebsites.net

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html

      - name: Create deployment ZIP
        run: |
          mkdir deployment
          cp package.json package-lock.json deployment/
          cp -R dist scripts deployment/
          cd deployment
          zip -r ../mabs-frontend.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: metahobbies
          slot-name: Production
          package: ./mabs-frontend.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
