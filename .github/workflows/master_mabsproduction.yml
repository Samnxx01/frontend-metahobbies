name: Build and deploy React Vite app to Azure Web App - Mabsproduction

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build
        env:
          VITE_API_URL: https://server-mabs-1.onrender.com/api
          VITE_API_BASE_URL: https://server-mabs-1.onrender.com/api
          VITE_SOCKET_URL: https://server-mabs-1.onrender.com
        

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: vite-app
          path: |
            dist
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: vite-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F6B37158C604454DACB333FD894C2239 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FF3BAB411A0498BAF7D61C57EEFEF97 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E12863873CAF4F19A04FA89ECEBE0272 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Mabsproduction'
          slot-name: 'Production'
          package: .
          
